# CCCMS 一键编排：Webman + MySQL 8 + Redis
#
#   cp .env.example .env       # 设置 JWT_SECRET / DATA_ENCRYPT_KEY / DB_PASSWORD
#   docker compose up -d --build
#   docker compose exec webman php webman cccms:menu-sync
#   docker compose exec webman php webman cccms:perm-scan
#
# 首次启动时 MySQL 自动导入 plugin/cccms/db/ 下的 schema.sql 与 seed.sql。
# 访问 http://localhost:8787 ，默认账号 admin / admin123。

services:
  webman:
    build:
      context: .
      args:
        INSTALL_REDIS_EXT: "1"
    image: cccms/webman:latest
    container_name: cccms-webman
    restart: unless-stopped
    environment:
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: cccms
      DB_USERNAME: cccms
      DB_PASSWORD: ${DB_PASSWORD:-cccms123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 未设置时直接报错退出，避免用「内置开发密钥」上了生产
      JWT_SECRET: ${JWT_SECRET:?请在 server/.env 中设置 JWT_SECRET}
      DATA_ENCRYPT_KEY: ${DATA_ENCRYPT_KEY:?请在 server/.env 中设置 DATA_ENCRYPT_KEY}
    ports:
      - "8787:8787"
    volumes:
      # 运行时（日志 / pid）与本地附件持久化
      - runtime:/app/runtime
      - storage:/app/public/storage
    # 与 MySQL / Redis 一样给出显式探活，`docker compose ps` 才能看到 webman 的 healthy 状态。
    # 探的是 /healthz（逐项检查 MySQL / Redis / 磁盘 / 内存，故障返回 503），
    # 与 Dockerfile 里的 HEALTHCHECK 同一口径；容器内来源是回环地址，
    # 默认就在 security.metrics_allow_ips 白名单里（开箱可用）。
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:8787/healthz']
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: cccms-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: cccms
      MYSQL_USER: cccms
      MYSQL_PASSWORD: ${DB_PASSWORD:-cccms123}
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在「数据卷为空」的首次初始化时执行，按文件名顺序：01 建表 → 02 种子
      - ./plugin/cccms/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./plugin/cccms/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_ROOT_PASSWORD:-root123456}']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: cccms-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  runtime:
  storage:
  mysql-data:
  redis-data:
