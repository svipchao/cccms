name: Backend CI

on:
  push:
    branches: ['main']
    paths:
      - 'server/**'
      - '.github/workflows/php.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'server/**'
      - '.github/workflows/php.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: cccms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cccms
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DATA_ENCRYPT_KEY: ci-only-crypto-key
      # 集成用例必须真跑：MySQL / Redis 没就绪时「跳过」会升级为「失败」，
      # 避免安全链路（登录双维度锁定 / 租户边界）在 CI 里静默失去回归保护
      CCCMS_TEST_REQUIRE_SERVICES: '1'

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pcntl, redis, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      # 不用 --strict：composer.json 继承自 webman 模板，空 PSR-4 前缀
      # （`"": "./"`，插件自动加载依赖它）会被 --strict 判为警告而非错误。
      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # 供应链审计：只审生产依赖（--no-dev）。有中高危漏洞即阻断合并。
      - name: Audit dependencies
        run: composer audit --no-dev

      # 静态分析：level 5 + baseline（既有的框架魔术方法类报错已冻结，
      # 新增代码引入的报错会直接失败）。不需要数据库，放在初始化库之前快速失败。
      - name: Static analysis (PHPStan)
        run: composer analyse

      # baseline 只许减不许增：否则「新增代码有问题」可以用「往 baseline 里追加一条」绕过去，
      # 冻结清单会慢慢变成垃圾桶。修完某条就从 baseline 删掉并下调上限。
      - name: Guard PHPStan baseline
        run: |
          count=$(grep -c 'message:' phpstan-baseline.neon || true)
          echo "phpstan-baseline 条目数：$count（上限 32）"
          if [ "$count" -gt 32 ]; then
            echo "::error::phpstan-baseline.neon 条目增加了（$count > 32）。请修正代码，而不是追加基线。"
            exit 1
          fi

      # 代码风格：@PSR12 基线，只校验 plugin/ 与 tests/（本仓库维护的代码）
      - name: Check code style
        run: composer cs:check

      - name: Initialize database
        run: |
          mysql -h 127.0.0.1 -uroot -p123456 cccms < plugin/cccms/db/schema.sql
          mysql -h 127.0.0.1 -uroot -p123456 cccms < plugin/cccms/db/seed.sql

      - name: Sync menus & permission nodes
        run: |
          php webman cccms:menu-sync
          php webman cccms:perm-scan

      # 以下三个命令都有语义化退出码，失败即阻断（与 docs/08 的提交前检查清单一致）
      - name: Check permission declarations
        run: php webman cccms:perm-scan --check

      - name: Check data scope integration
        run: php webman cccms:data-scope-check

      - name: Check data rule conflicts
        run: php webman cccms:data-rule-check

      - name: Check write-entry field whitelists
        run: php webman cccms:write-guard-check

      # 读运行时路由表：能发现「有注解、有方法、但没挂路由」的死接口
      - name: Check route / annotation consistency
        run: php webman cccms:openapi-check

      - name: Unit tests
        run: composer test

  # 镜像构建门禁：Dockerfile 的扩展编译 / 非 root 运行 / vendor_patch 都是「线上才生效」的，
  # 不构建一次就等于零验证。只 build 不 push。
  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: server
          target: runtime
          push: false
          tags: cccms/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
